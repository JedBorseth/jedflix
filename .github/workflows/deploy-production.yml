name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_stack:
        description: Rebuild every Compose service, including music-ai and musicbrainz-db images
        type: boolean
        default: false

# Prefer a fresh runner if GitHub fails to acquire one for a long time.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY}" ]; then
            echo "CONVEX_DEPLOY_KEY is required to deploy Convex schema and functions."
            exit 1
          fi
          if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=50 origin "${BEFORE_SHA}" 2>/dev/null || true
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              if ! git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" | grep -Eq '^(convex/|package.json|bun.lock)'; then
                echo "Skipping Convex deploy; no convex/lockfile changes."
                exit 0
              fi
            fi
          fi
          bunx convex deploy

      - name: Deploy Docker stack on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/jedborseth/jedflix' }}
          FULL_STACK: ${{ github.event.inputs.full_stack || 'false' }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: PROD_APP_DIR,FULL_STACK
          # Full music-ai CUDA rebuilds can still exceed 20m when those files change.
          command_timeout: 70m
          script: |
            set -euo pipefail
            cd "${PROD_APP_DIR}"

            echo "== Ensure MusicBrainz / artwork / model dirs on disk1 =="
            mkdir -p /mnt/disk1/jedflix/musicbrainz/{pgdata,meili,dumps,replication} \
              /mnt/disk1/jedflix/music-artwork/{by-mbid,by-hash,missing} \
              /mnt/disk1/jedflix/models || true

            echo "== Disk before cleanup =="
            df -h / || true
            df -h /mnt/disk1 || true
            docker system df || true

            # Free dangling containers/images only. Keep the BuildKit cache so
            # the CUDA/torch music-ai image does not rebuild from scratch.
            # Do NOT prune volumes — caddy_data holds TLS certs; pgdata is on disk1.
            docker container prune -f || true
            docker image prune -f || true
            avail_kb="$(df -P / | awk 'NR==2 { print $4 }')"
            if [ "${avail_kb:-0}" -lt 8388608 ]; then
              echo "Root has under 8G free; pruning BuildKit cache"
              docker builder prune -af || true
            fi

            echo "== Disk after cleanup =="
            df -h / || true

            before="$(git rev-parse HEAD)"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy-compose.sh

            if [ "${FULL_STACK:-false}" = "true" ]; then
              ./scripts/deploy-compose.sh --full
            else
              ./scripts/deploy-compose.sh --since "${before}"
            fi

            docker image prune -f || true

            echo "== Disk after deploy =="
            df -h / || true
            docker compose ps

            echo "== Smoke: backend health via /backend =="
            curl -fsS "http://127.0.0.1/backend/health" || curl -fsS "https://127.0.0.1/backend/health" -k || true

            echo "== Smoke: pgvector extension =="
            docker compose exec -T musicbrainz-db psql -U musicbrainz -d musicbrainz -c "CREATE EXTENSION IF NOT EXISTS vector; SELECT extname, extversion FROM pg_extension WHERE extname IN ('vector','pg_trgm');" || true

            echo "== Smoke: music-ai live =="
            docker compose exec -T music-ai python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/live').read().decode())" || true
            docker compose logs --tail=20 music-ai music-embed || true
