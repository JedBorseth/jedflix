name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prefer a fresh runner if GitHub fails to acquire one for a long time.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY}" ]; then
            echo "CONVEX_DEPLOY_KEY is required to deploy Convex schema and functions."
            exit 1
          fi
          bunx convex deploy

      - name: Deploy Docker stack on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/jedborseth/jedflix' }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: PROD_APP_DIR
          # CUDA image + torch + first pgvector postgres build can exceed 20m.
          command_timeout: 70m
          script: |
            set -euo pipefail
            cd "${PROD_APP_DIR}"

            echo "== Ensure MusicBrainz / artwork / model dirs on disk1 =="
            mkdir -p /mnt/disk1/jedflix/musicbrainz/{pgdata,meili,dumps,replication} \
              /mnt/disk1/jedflix/music-artwork/{by-mbid,by-hash,missing} \
              /mnt/disk1/jedflix/models || true

            echo "== Disk before cleanup =="
            df -h / || true
            df -h /mnt/disk1 || true
            docker system df || true

            # Free dangling containers/images only. Keep the BuildKit cache so
            # the CUDA/torch music-ai image does not rebuild from scratch.
            # Do NOT prune volumes — caddy_data holds TLS certs.
            docker container prune -f || true
            docker image prune -f || true
            avail_kb="$(df -P / | awk 'NR==2 { print $4 }')"
            if [ "${avail_kb:-0}" -lt 8388608 ]; then
              echo "Root has under 8G free; pruning BuildKit cache"
              docker builder prune -af || true
            fi

            echo "== Disk after cleanup =="
            df -h / || true

            git fetch origin main
            git reset --hard origin/main
            # --remove-orphans drops renamed services (e.g. stream-server → backend).
            docker compose up -d --build --remove-orphans
            # Caddyfile is bind-mounted; force recreate so /backend routing reloads.
            docker compose up -d --force-recreate --no-deps caddy

            # Reclaim replaced image layers, but keep BuildKit cache.
            docker image prune -f || true

            echo "== Disk after deploy =="
            df -h / || true
            docker compose ps

            echo "== Smoke: backend health via /backend =="
            curl -fsS "http://127.0.0.1/backend/health" || curl -fsS "https://127.0.0.1/backend/health" -k || true

            echo "== Smoke: pgvector extension =="
            docker compose exec -T musicbrainz-db psql -U musicbrainz -d musicbrainz -c "CREATE EXTENSION IF NOT EXISTS vector; SELECT extname, extversion FROM pg_extension WHERE extname IN ('vector','pg_trgm');" || true

            echo "== Smoke: music-ai live =="
            docker compose exec -T music-ai python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/live').read().decode())" || true
            docker compose logs --tail=20 music-ai music-embed || true
