name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prefer a fresh runner if GitHub fails to acquire one for a long time.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY}" ]; then
            echo "CONVEX_DEPLOY_KEY is required to deploy Convex schema and functions."
            exit 1
          fi
          bunx convex deploy

      - name: Deploy Docker stack on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/jedborseth/jedflix' }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: PROD_APP_DIR
          # Build + prune can exceed the default on a tight disk.
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${PROD_APP_DIR}"

            echo "== Disk before cleanup =="
            df -h / || true
            docker system df || true

            # Free space before git fetch/build. Do NOT prune volumes —
            # caddy_data holds TLS certs.
            docker builder prune -af || true
            docker image prune -af || true
            docker container prune -f || true
            # Drop unused networks/build cache without touching volumes.
            docker system prune -af || true

            echo "== Disk after cleanup =="
            df -h / || true

            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build

            # Reclaim layers left behind by the new images.
            docker image prune -af || true
            docker builder prune -af || true

            echo "== Disk after deploy =="
            df -h / || true
            docker compose ps
