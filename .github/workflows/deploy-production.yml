name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_stack:
        description: Rebuild every Compose service, including the musicbrainz-db image
        type: boolean
        default: false

# Prefer a fresh runner if GitHub fails to acquire one for a long time.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Test audiobook proxy recovery
        run: python3 scripts/warp-proxy.test.py

      - name: Test selective Compose deploy plan
        run: bash scripts/deploy-compose-plan.test.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fail before Convex deploys if the server checkout has hand edits the
      # Docker step would refuse to overwrite.
      - name: Check server checkout is clean
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/jedborseth/jedflix' }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: PROD_APP_DIR
          script: |
            set -euo pipefail
            cd "${PROD_APP_DIR}"
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Refusing to deploy: tracked files have local changes on the server."
              git status --short --untracked-files=no
              exit 1
            fi

      # Always deploy: a skipped or cancelled earlier run must not leave
      # Convex behind the Docker stack.
      - name: Deploy Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY}" ]; then
            echo "CONVEX_DEPLOY_KEY is required to deploy Convex schema and functions."
            exit 1
          fi
          bunx convex deploy

      - name: Deploy Docker stack on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/jedborseth/jedflix' }}
          FULL_STACK: ${{ github.event.inputs.full_stack || 'false' }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: PROD_APP_DIR,FULL_STACK,DEPLOY_SHA
          command_timeout: 70m
          script: |
            set -euo pipefail
            cd "${PROD_APP_DIR}"

            echo "== Ensure MusicBrainz and artwork directories on disk1 =="
            mkdir -p /mnt/disk1/jedflix/musicbrainz/{pgdata,dumps,replication} \
              /mnt/disk1/jedflix/music-artwork/{by-mbid,by-hash,missing} || true

            echo "== Disk before cleanup =="
            df -h / /mnt/disk1 /var/lib/containerd /var/lib/docker || true
            docker system df || true

            # Free dangling containers and images before checking available disk space.
            # Do NOT prune volumes — caddy_data holds TLS certs; pgdata is on disk1.
            docker container prune -f || true
            docker image prune -f || true
            # Docker data-root lives on /mnt/disk1 (bind-mounted). CUDA exports
            # need tens of GB there; also keep some headroom on the root SSD.
            avail_root_kb="$(df -P / | awk 'NR==2 { print $4 }')"
            avail_docker_kb="$(df -P /var/lib/containerd 2>/dev/null | awk 'NR==2 { print $4 }')"
            if [ "${avail_root_kb:-0}" -lt 8388608 ] || [ "${avail_docker_kb:-0}" -lt 20971520 ]; then
              echo "Low disk (root ${avail_root_kb:-0} KB, docker ${avail_docker_kb:-0} KB); pruning BuildKit cache"
              docker builder prune -af || true
            fi

            echo "== Disk after cleanup =="
            df -h / /mnt/disk1 /var/lib/containerd || true

            # Never discard hand edits to tracked files on the server.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Refusing to deploy: tracked files have local changes on the server."
              git status --short --untracked-files=no
              exit 1
            fi

            # Diff against the last successful deploy and, after a failed
            # attempt, against that attempt too: its partial rollout may have
            # recreated services the next commit no longer touches.
            git fetch origin main
            deployed="$(cat .git/jedflix-last-deployed 2>/dev/null || echo unknown)"
            attempted="$(cat .git/jedflix-deploy-attempted 2>/dev/null || true)"
            since=(--since "${deployed}")
            if [ -n "${attempted}" ] && [ "${attempted}" != "${deployed}" ]; then
              since+=(--since "${attempted}")
            fi

            # Deploy exactly the commit that CI tested and pushed to Convex.
            git reset --hard "${DEPLOY_SHA}"
            echo "${DEPLOY_SHA}" > .git/jedflix-deploy-attempted
            chmod +x scripts/deploy-compose.sh

            if [ "${FULL_STACK:-false}" = "true" ]; then
              ./scripts/deploy-compose.sh --full
            else
              ./scripts/deploy-compose.sh "${since[@]}"
            fi

            docker image prune -f || true

            echo "== Disk after deploy =="
            df -h / /mnt/disk1 /var/lib/containerd || true
            docker compose ps

            echo "== Smoke: backend health =="
            healthy=false
            for attempt in $(seq 1 30); do
              if docker compose exec -T backend wget -qO- http://127.0.0.1:8080/health; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "${healthy}" != true ]; then
              echo "Backend failed its health check after deploy."
              docker compose logs --tail=50 backend || true
              exit 1
            fi
            echo "${DEPLOY_SHA}" > .git/jedflix-last-deployed
