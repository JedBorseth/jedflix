services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
        VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-${VITE_STREAM_API_URL:-/backend}}
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ENV: production
      DOMAIN: ${DOMAIN}
      TORRENTIO_URL: ${TORRENTIO_URL:-https://torrentio.strem.fun}
      MAX_VIDEO_SIZE_GB: ${MAX_VIDEO_SIZE_GB:-50}
      MIN_SEEDERS: ${MIN_SEEDERS:-3}
      PREFER_INSTANT: ${PREFER_INSTANT:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      LETTERBOXD_BASE_URL: ${LETTERBOXD_BASE_URL:-https://letterboxd.com}
      LETTERBOXD_CACHE_TTL: ${LETTERBOXD_CACHE_TTL:-1h}
      OPEN_LIBRARY_BASE_URL: ${OPEN_LIBRARY_BASE_URL:-https://openlibrary.org}
      OPEN_LIBRARY_CACHE_TTL: ${OPEN_LIBRARY_CACHE_TTL:-12h}
      OPEN_LIBRARY_COVER_PUBLIC_BASE: ${OPEN_LIBRARY_COVER_PUBLIC_BASE:-/backend/api/v1/openlibrary/covers}
      TMDB_API_KEY: ${TMDB_API_KEY:-${VITE_TMDB_API_KEY:-}}
      MUSIC_CATALOG_PATH: ${MUSIC_CATALOG_PATH:-/data/music-catalog.json}
      MUSIC_CATALOG_CACHE_TTL: ${MUSIC_CATALOG_CACHE_TTL:-6h}
      MUSICBRAINZ_API_BASE_URL: ${MUSICBRAINZ_API_BASE_URL:-https://musicbrainz.org/ws/2}
      COVER_ART_ARCHIVE_BASE_URL: ${COVER_ART_ARCHIVE_BASE_URL:-https://coverartarchive.org}
      # Local MusicBrainz replica + pgvector/Qwen search (no public MB API for search/detail).
      MUSICBRAINZ_DATABASE_URL: ${MUSICBRAINZ_DATABASE_URL:-postgres://musicbrainz:${MUSICBRAINZ_DB_PASSWORD:-musicbrainz}@musicbrainz-db:5432/musicbrainz?sslmode=disable}
      MUSIC_AI_URL: ${MUSIC_AI_URL:-http://music-ai:8000}
      MUSIC_ARTWORK_PATH: ${MUSIC_ARTWORK_PATH:-/data/music-artwork}
      MUSIC_COVER_PUBLIC_BASE: ${MUSIC_COVER_PUBLIC_BASE:-/backend/api/v1/music/covers}
      # Spotify credentials unused for catalog; still accepted for local tooling.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_CACHE_TTL: ${LASTFM_CACHE_TTL:-6h}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      ABB_BASE_URL: ${ABB_BASE_URL:-https://audiobookbay.lu}
      ABB_USERNAME: ${ABB_USERNAME:-}
      ABB_PASSWORD: ${ABB_PASSWORD:-}
      MAX_CONCURRENT_RESOLVES: ${MAX_CONCURRENT_RESOLVES:-6}
      MAX_CONCURRENT_YOUTUBE: ${MAX_CONCURRENT_YOUTUBE:-3}
    volumes:
      - backend_data:/data
      # Lazy CAA artwork cache — permanent files on disk1.
      - ${JEDFLIX_DATA_ROOT:-/mnt/disk1/jedflix}/music-artwork:/data/music-artwork
    depends_on:
      musicbrainz-db:
        condition: service_healthy

  # --- Local MusicBrainz (data lives on /mnt/disk1/jedflix) ---
  musicbrainz-db:
    build:
      context: .
      dockerfile: deploy/musicbrainz/Dockerfile.postgres
    image: jedflix-musicbrainz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicbrainz
      POSTGRES_USER: musicbrainz
      POSTGRES_PASSWORD: ${MUSICBRAINZ_DB_PASSWORD:-musicbrainz}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=2GB
    volumes:
      - ${JEDFLIX_DATA_ROOT:-/mnt/disk1/jedflix}/musicbrainz/pgdata:/var/lib/postgresql/data
      - ${JEDFLIX_DATA_ROOT:-/mnt/disk1/jedflix}/musicbrainz/dumps:/dumps
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbrainz -d musicbrainz"]
      interval: 10s
      timeout: 5s
      retries: 12

  mbslave:
    build:
      context: .
      dockerfile: deploy/musicbrainz/Dockerfile.mbslave
    profiles: ["music-tools"]
    environment:
      MBSLAVE_DB_HOST: musicbrainz-db
      MBSLAVE_DB_PORT: 5432
      MBSLAVE_DB_NAME: musicbrainz
      MBSLAVE_DB_USER: musicbrainz
      MBSLAVE_DB_PASSWORD: ${MUSICBRAINZ_DB_PASSWORD:-musicbrainz}
      MBSLAVE_MUSICBRAINZ_TOKEN: ${MBSLAVE_MUSICBRAINZ_TOKEN:-}
    volumes:
      - ${JEDFLIX_DATA_ROOT:-/mnt/disk1/jedflix}/musicbrainz/dumps:/dumps
      - ${JEDFLIX_DATA_ROOT:-/mnt/disk1/jedflix}/musicbrainz/replication:/replication
    depends_on:
      musicbrainz-db:
        condition: service_healthy

  music-ai:
    build:
      context: ./apps/music-ai
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models
      TRANSFORMERS_CACHE: /models
      MUSIC_AI_EMBEDDING_MODEL: ${MUSIC_AI_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      MUSIC_AI_RERANKER_MODEL: ${MUSIC_AI_RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      MUSIC_AI_EMBEDDING_DIM: ${MUSIC_AI_EMBEDDING_DIM:-512}
      MUSIC_AI_EMBED_BATCH: ${MUSIC_AI_EMBED_BATCH:-8}
    volumes:
      - ${JEDFLIX_DATA_ROOT:-/mnt/disk1/jedflix}/models:/models
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  music-embed:
    build:
      context: ./apps/backend
      target: embedder
    restart: unless-stopped
    environment:
      MUSICBRAINZ_DATABASE_URL: postgres://musicbrainz:${MUSICBRAINZ_DB_PASSWORD:-musicbrainz}@musicbrainz-db:5432/musicbrainz?sslmode=disable
      MUSIC_AI_URL: http://music-ai:8000
    depends_on:
      musicbrainz-db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  backend_data:
