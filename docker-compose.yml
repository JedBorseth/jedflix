services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
        VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-${VITE_STREAM_API_URL:-/backend}}
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ENV: production
      DOMAIN: ${DOMAIN}
      TORRENTIO_URL: ${TORRENTIO_URL:-https://torrentio.strem.fun}
      MAX_VIDEO_SIZE_GB: ${MAX_VIDEO_SIZE_GB:-50}
      MIN_SEEDERS: ${MIN_SEEDERS:-3}
      PREFER_INSTANT: ${PREFER_INSTANT:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      LETTERBOXD_BASE_URL: ${LETTERBOXD_BASE_URL:-https://letterboxd.com}
      LETTERBOXD_CACHE_TTL: ${LETTERBOXD_CACHE_TTL:-1h}
      OPEN_LIBRARY_BASE_URL: ${OPEN_LIBRARY_BASE_URL:-https://openlibrary.org}
      OPEN_LIBRARY_CACHE_TTL: ${OPEN_LIBRARY_CACHE_TTL:-12h}
      OPEN_LIBRARY_COVER_PUBLIC_BASE: ${OPEN_LIBRARY_COVER_PUBLIC_BASE:-/backend/api/v1/openlibrary/covers}
      TMDB_API_KEY: ${TMDB_API_KEY:-${VITE_TMDB_API_KEY:-}}
      MUSIC_CATALOG_PATH: ${MUSIC_CATALOG_PATH:-/data/music-catalog.json}
      MUSIC_CATALOG_CACHE_TTL: ${MUSIC_CATALOG_CACHE_TTL:-6h}
      MUSICBRAINZ_API_BASE_URL: ${MUSICBRAINZ_API_BASE_URL:-https://musicbrainz.org/ws/2}
      COVER_ART_ARCHIVE_BASE_URL: ${COVER_ART_ARCHIVE_BASE_URL:-https://coverartarchive.org}
      # Spotify credentials unused for catalog; still accepted for local tooling.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_CACHE_TTL: ${LASTFM_CACHE_TTL:-6h}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      ABB_BASE_URL: ${ABB_BASE_URL:-https://audiobookbay.lu}
      ABB_USERNAME: ${ABB_USERNAME:-}
      ABB_PASSWORD: ${ABB_PASSWORD:-}
      MAX_CONCURRENT_RESOLVES: ${MAX_CONCURRENT_RESOLVES:-6}
      MAX_CONCURRENT_YOUTUBE: ${MAX_CONCURRENT_YOUTUBE:-3}
    volumes:
      - backend_data:/data

volumes:
  caddy_data:
  caddy_config:
  backend_data:
